
spring.application.name=tech-challenge

# MySQL - Fase 1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/fiapdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:fiapdb}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:fiapdb}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# MongoDB - Fase 2
spring.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://admin:admin123@localhost:27017/fiapfase2?authSource=admin}

# Jackson
spring.jackson.datatype.enum.read-unknown-enum-values-as-null=true
spring.jackson.time-zone=America/Sao_Paulo
